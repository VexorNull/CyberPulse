<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPulse v5.0 OS // Tanveer Hussain @VexorNull</title>

    <meta name="author" content="Tanveer Hussain">
    <meta name="designer" content="@VexorNull">
    <meta name="credit" content="Engineered by Tanveer Hussain (@VexorNull)">

    <style>
        :root {
            --bg-deep: #020617;
            --accent-main: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.5);
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --panel-bg: rgba(15, 23, 42, 0.92);
            --border-std: 1px solid rgba(6, 182, 212, 0.3);
            --font-mono: 'Fira Code', monospace, monospace;
        }

        body.theme-matrix { --accent-main: #10b981; --accent-glow: rgba(16, 185, 129, 0.5); }
        body.theme-pink { --accent-main: #f43f5e; --accent-glow: rgba(244, 63, 94, 0.5); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        #matrix-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; opacity: 0.15;
        }

        .container {
            position: relative; z-index: 2;
            width: 95%; max-width: 1100px; margin: 30px 0;
        }

        .cyber-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: var(--border-std);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Top Header Navigation Tabs */
        .card-header {
            background: rgba(2, 6, 23, 0.95);
            padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap; gap: 10px;
        }

        .nav-tabs { display: flex; gap: 8px; }

        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 6px 14px;
            font-family: var(--font-mono);
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            border-color: var(--accent-main);
            color: var(--accent-main);
            background: rgba(6, 182, 212, 0.1);
        }

        .card-body { padding: 30px; }

        /* OS App Containers */
        .app-section { display: none; }
        .app-section.active { display: block; }

        /* App 1: Task Manager */
        .task-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        
        .cyber-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-mono);
            border-radius: 6px;
            outline: none;
            flex-grow: 1;
        }

        .cyber-input:focus { border-color: var(--accent-main); }

        .btn-add {
            background: var(--accent-main);
            color: #000; font-weight: bold;
            padding: 10px 20px; border: none;
            border-radius: 6px; cursor: pointer;
            font-family: var(--font-mono);
        }

        .task-list { list-style: none; }

        .task-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px;
            font-family: var(--font-mono);
            font-size: 14px;
        }

        .task-item.completed { text-decoration: line-through; opacity: 0.5; }

        .task-actions { display: flex; gap: 8px; }
        .action-btn { background: transparent; border: none; cursor: pointer; color: var(--text-muted); }
        .action-btn:hover { color: var(--accent-main); }

        /* App 2: Code Scratchpad */
        .notes-area {
            width: 100%; height: 220px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-green);
            font-family: var(--font-mono);
            padding: 15px; border-radius: 6px;
            outline: none; resize: none;
        }

        /* App 3: Terminal */
        .cyber-shell {
            background: rgba(0, 2, 6, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 15px;
            font-family: var(--font-mono); font-size: 13px;
            color: var(--accent-green); max-height: 250px; overflow-y: auto;
        }

        .prompt { color: var(--text-main); font-weight: bold; margin-right: 8px; }
        .shell-input { background: transparent; border: none; outline: none; color: var(--accent-green); font-family: var(--font-mono); font-size: 13px; width: 80%; }

        footer {
            padding: 20px; text-align: center;
            font-family: var(--font-mono); font-size: 12px;
            color: var(--text-muted); width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(2, 6, 23, 0.95);
        }

        .credit-link { color: var(--accent-main); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <main class="container">
        <div class="cyber-card">
            <div class="card-header">
                <div class="nav-tabs">
                    <button class="tab-btn active" onclick="switchApp('tasks')">[1] Task Manager</button>
                    <button class="tab-btn" onclick="switchApp('notes')">[2] Code Scratchpad</button>
                    <button class="tab-btn" onclick="switchApp('terminal')">[3] System Shell</button>
                </div>
                <div style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-main);">
                    CyberPulse OS v5.0
                </div>
            </div>

            <div class="card-body">

                <section id="app-tasks" class="app-section active">
                    <h2 style="font-family: var(--font-mono); margin-bottom: 15px; font-size: 18px;">// Cyber Task Protocol</h2>
                    <div class="task-input-group">
                        <input type="text" id="task-input" class="cyber-input" placeholder="Enter new task or command..." autocomplete="off">
                        <button class="btn-add" onclick="addTask()">Add Task</button>
                    </div>
                    <ul id="task-list" class="task-list"></ul>
                </section>

                <section id="app-notes" class="app-section">
                    <h2 style="font-family: var(--font-mono); margin-bottom: 15px; font-size: 18px;">// Live Code & Notes Buffer</h2>
                    <textarea id="notes-input" class="notes-area" placeholder="// Type your quick code snippets or notes here. Auto-saved to local memory."></textarea>
                </section>

                <section id="app-terminal" class="app-section">
                    <div class="cyber-shell" id="shell-container">
                        <div id="shell-logs">
                            <div>[CyberPulse OS Terminal Ready. Commands: <b style="color:var(--accent-main)">task add &lt;text&gt;</b>, <b style="color:var(--accent-main)">theme</b>, <b style="color:var(--accent-main)">clear</b>]</div>
                        </div>
                        <div style="display:flex; align-items:center; margin-top:10px;">
                            <span class="prompt">root@cyberpulse:~#</span>
                            <input type="text" id="shell-input" class="shell-input" placeholder="Type command..." autocomplete="off">
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer>
        <p>Architected & Developed by <a href="https://github.com/VexorNull" class="credit-link">Tanveer Hussain @VexorNull</a> | CyberPulse Productivity OS</p>
    </footer>

    <script>
        // Tab Switcher
        function switchApp(appId) {
            document.querySelectorAll('.app-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`app-${appId}`).classList.add('active');
            event.target.classList.add('active');
        }

        // --- Task Manager App Logic ---
        let tasks = JSON.parse(localStorage.getItem('cyber_tasks') || '[]');

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            tasks.forEach((t, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${t.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <span>> ${t.text}</span>
                    <div class="task-actions">
                        <button class="action-btn" onclick="toggleTask(${index})">✓</button>
                        <button class="action-btn" onclick="deleteTask(${index})">✕</button>
                    </div>
                `;
                list.appendChild(li);
            });
            localStorage.setItem('cyber_tasks', JSON.stringify(tasks));
        }

        function addTask(customText) {
            const input = document.getElementById('task-input');
            const text = customText || input.value.trim();
            if (text) {
                tasks.push({ text: text, completed: false });
                input.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        document.getElementById('task-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // --- Notes Scratchpad Auto-Save ---
        const notesArea = document.getElementById('notes-input');
        notesArea.value = localStorage.getItem('cyber_notes') || '';
        notesArea.addEventListener('input', () => {
            localStorage.setItem('cyber_notes', notesArea.value);
        });

        // --- Terminal Integration ---
        const shellInput = document.getElementById('shell-input');
        const shellLogs = document.getElementById('shell-logs');

        shellInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = shellInput.value.trim();
                const cmdLine = document.createElement('div');
                cmdLine.innerHTML = `<span class="prompt">root@cyberpulse:~#</span> ${val}`;
                shellLogs.appendChild(cmdLine);

                const res = document.createElement('div');
                res.style.color = 'var(--accent-main)';

                if (val.startsWith('task add ')) {
                    const taskText = val.replace('task add ', '');
                    addTask(taskText);
                    res.textContent = `Task created: "${taskText}"`;
                } else if (val === 'theme') {
                    if (document.body.classList.contains('theme-matrix')) {
                        document.body.className = 'theme-pink';
                        res.textContent = 'Theme: Pink Neon';
                    } else {
                        document.body.className = 'theme-matrix';
                        res.textContent = 'Theme: Matrix Green';
                    }
                } else if (val === 'clear') {
                    shellLogs.innerHTML = ''; shellInput.value = ''; return;
                } else {
                    res.style.color = 'var(--accent-red)';
                    res.textContent = `Unknown command. Try 'task add <name>' or 'theme'`;
                }

                shellLogs.appendChild(res);
                shellInput.value = '';
                document.getElementById('shell-container').scrollTop = document.getElementById('shell-container').scrollHeight;
            }
        });

        // --- Background Matrix Effect ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let drops = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drops = Array(Math.floor(canvas.width / 20)).fill(1);
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#06b6d4';
            ctx.font = '14px monospace';

            drops.forEach((y, i) => {
                ctx.fillText(Math.random() > 0.5 ? '1' : '0', i * 20, y * 20);
                if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }

        window.addEventListener('resize', resize);
        resize();
        setInterval(drawMatrix, 40);

        renderTasks();
    </script>
</body>
</html>
